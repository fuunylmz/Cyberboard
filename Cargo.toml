[workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/agent",
    "crates/agent-protocol",
    "crates/config",
    "crates/config-compiler",
    "crates/domain",
    "crates/observability",
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
prost-build = "0.14"
sha2 = "0.10"
rand_core = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.11", features = ["serde", "v4"] }

cyberboard-agent-protocol = { path = "crates/agent-protocol" }
cyberboard-config = { path = "crates/config" }
cyberboard-config-compiler = { path = "crates/config-compiler" }
cyberboard-database = { path = "crates/database" }
cyberboard-domain = { path = "crates/domain" }
cyberboard-observability = { path = "crates/observability" }
cyberboard-storage = { path = "crates/storage" }
