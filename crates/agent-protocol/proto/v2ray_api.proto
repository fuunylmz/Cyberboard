syntax = "proto3";

// sing-box 1.14.x registers this service under this package at runtime,
// although its source files live under experimental/v2rayapi.
package v2ray.core.app.stats.command;

service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

message Stat {
  string name = 1;
  int64 value = 2;
}
